name: Release

# Publishes to PyPI when a v* tag is pushed. Uses PyPI Trusted Publishing (OIDC),
# so no API token secret is needed once you register this repo + the "pypi"
# environment as a trusted publisher at https://pypi.org/manage/account/publishing/.
# (Prefer a token instead? Swap the last step for pypa/gh-action-pypi-publish with
#  `password: ${{ secrets.PYPI_API_TOKEN }}`.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
