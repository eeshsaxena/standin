name: Release

# Publishes to PyPI when a v* tag is pushed, using a PyPI API token stored as the
# repository secret PYPI_API_TOKEN (Settings -> Secrets and variables -> Actions).
# The token never leaves GitHub's secret store.
# (Prefer tokenless Trusted Publishing? Drop the `with: password` below, add
#  `permissions: id-token: write`, and register a trusted publisher on PyPI.)

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
